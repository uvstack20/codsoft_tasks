      <div class="page-intro">
        <p class="eyebrow">Contact</p>
        <h1>Let's create something meaningful together.</h1>
      </div>
    </header>

    <main class="page-content contact-section">
      <section class="panel">
        <h2>Get In Touch</h2>
        <p>Email me at <a href="mailto:utkarshv@gmail.com">utkarshv@gmail.com</a></p>
        <p>Or use the form below and I will follow up soon.</p>
      </section>

      <section class="panel">
        <form id="contactForm" class="contact-form" novalidate>
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea name="message" rows="5" placeholder="Tell me about your project" required></textarea>
          <button type="submit" class="btn btn-primary">Send Message</button>
          <p id="formMessage" class="form-message"></p>
        </form>
      </section>
    </main>
