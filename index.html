<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A smart to-do list app with offline support, dark mode, and installable PWA features." />
    <meta name="theme-color" content="#07111f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="कारYA" />
    <link rel="apple-touch-icon" href="images/logo.svg" />
    <link rel="manifest" href="manifest.json" />
    <title>कारYA | To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero-card">
        <div class="brand">
          <img src="images/logo.svg" alt="कारYA logo" class="logo" />
          <div>
            <p class="eyebrow">Smart Daily Planner</p>
            <h1>कारYA</h1>
          </div>
        </div>
        <div class="hero-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">🌙</button>
          <button id="install-btn" class="secondary-btn" type="button" hidden>Install App</button>
          <img src="images/hero.svg" alt="Task management illustration" class="hero-image" />
        </div>
      </header>

      <section class="panel form-panel">
        <h2>Add a new task</h2>
        <form id="task-form" class="task-form">
          <input
            id="task-input"
            type="text"
            maxlength="80"
            placeholder="Enter a task..."
            autocomplete="off"
          />
          <select id="priority-select" aria-label="Select priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <input id="due-date-input" type="date" aria-label="Select due date" />
          <button type="submit" class="primary-btn">Add Task</button>
        </form>
        <p id="form-message" class="form-message" aria-live="polite"></p>
        <div id="alert-area" class="alert-area" aria-live="polite"></div>
      </section>

      <section class="panel controls-panel">
        <div class="stats">
          <div class="stat-card">
            <span class="stat-label">Total</span>
            <strong id="total-count">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Completed</span>
            <strong id="completed-count">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Pending</span>
            <strong id="pending-count">0</strong>
          </div>
        </div>

        <div class="toolbar">
          <input id="search-input" type="search" placeholder="Search tasks" />
          <select id="filter-select">
            <option value="all">All tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </section>

      <section class="panel task-panel">
        <div class="task-panel-header">
          <h2>Your tasks</h2>
          <p id="task-summary">0 tasks shown</p>
        </div>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </div>

    <footer class="footer-credit">
      <p>Copyright © 2026 Utkarsh Verma</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
